name: CI

on:
  push:
    branches:
      - dev
      - "codex/**"
  pull_request:
    branches:
      - dev

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: chmod +x scripts/*.sh
      - run: ./scripts/run_checks.sh
